plugins { id 'com.android.application' }
android {
    namespace 'io.notrack.slave'
    compileSdk 34
    defaultConfig {
        applicationId 'io.notrack.slave'
        minSdk 21
        targetSdk 34
        versionCode (System.getenv("GITHUB_RUN_NUMBER") != null ? Integer.parseInt(System.getenv("GITHUB_RUN_NUMBER")) : 1)
        versionName (System.getenv("GITHUB_RUN_NUMBER") != null ? "1.0." + System.getenv("GITHUB_RUN_NUMBER") : "1.0")
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}